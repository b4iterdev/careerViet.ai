[project]
name = "mocnghe"
version = "0.1.0"
description = "Local-first Mốc Nghề CLI foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pydantic>=2.8",
    "reportlab>=5.0.1",
    "typer>=0.12",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]

[project.scripts]
mocnghe = "mocnghe.cli:app"

[dependency-groups]
dev = [
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/mocnghe"]
